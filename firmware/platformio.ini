; PlatformIO build for the SPINE node. Run from this folder:  pio run -e esp32 -t upload
[platformio]
src_dir = spine_node
default_envs = esp32

[env]
platform = espressif32
framework = arduino
monitor_speed = 921600
upload_speed = 921600

[env:esp32]
board = esp32dev

[env:esp32s3]
board = esp32-s3-devkitc-1
build_flags = -DBOARD_IS_S3=1
